name: gooteam_stream
description: "GooTeam Stream - A professional video meeting app with WebRTC and Firebase"
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5

  # WebRTC for video/audio streaming
  flutter_webrtc: ^0.9.22

  # Firebase services
  firebase_core: ^2.15.0
  firebase_auth: ^4.7.2
  cloud_firestore: ^4.8.4
  firebase_storage: ^11.2.5
  google_sign_in: ^6.1.4

  # UI and Navigation
  go_router: ^10.0.0
  flutter_svg: ^2.0.7
  cached_network_image: ^3.2.3

  # Utilities
  uuid: ^3.0.7
  permission_handler: ^10.4.3
  path_provider: ^2.1.0
  intl: ^0.18.1
  dartz: ^0.10.1
  get_it: ^7.6.0

  # Development and debugging
  logger: ^2.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  bloc_test: ^9.1.7
  mocktail: ^1.0.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
