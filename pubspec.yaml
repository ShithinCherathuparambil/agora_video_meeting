name: gooteam_stream
description: "GooTeam Stream - A professional video meeting app with WebRTC and Firebase"
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5

  # WebRTC for video/audio streaming
  flutter_webrtc:
    git:
      url: https://github.com/flutter-webrtc/flutter-webrtc.git

  # Firebase services
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.3
  firebase_storage: ^12.3.2
  google_sign_in: ^6.2.1

  # UI and Navigation
  go_router: ^14.6.1
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.4.1

  # Utilities
  uuid: ^4.5.1
  permission_handler: ^11.3.1
  path_provider: ^2.1.4
  intl: ^0.19.0
  dartz: ^0.10.1
  get_it: ^8.0.2

  # Development and debugging
  logger: ^2.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  bloc_test: ^9.1.7
  mocktail: ^1.0.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
